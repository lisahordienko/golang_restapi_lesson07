{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LibraTrack | Catalog</title>
  <link rel="stylesheet" href="/static/catalog.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/catalog">LibraTrack</a><span>Library catalog</span>{{if .SignedIn}}<div class="session-user"><span class="session-indicator" aria-hidden="true"></span><span class="session-identity"><strong>{{.Email}}</strong><small>{{.Role}}</small></span><form action="/web/logout" method="post"><button type="submit">Sign out</button></form></div>{{else}}<form class="session-login" action="/web/login" method="post"><input type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="username" required><input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required><button type="submit">Sign in</button></form>{{end}}</header>
  <main class="catalog-shell">
    <section class="catalog-heading"><div><p class="eyebrow">COLLECTION</p><h1>Browse the catalog</h1></div><span class="book-count">{{.Count}} titles</span></section>
    <form class="search" role="search" onsubmit="return false">
      <label for="book-search">Search titles, authors, or ISBN</label>
      <input id="book-search" name="q" type="search" placeholder="Try a title or author" autocomplete="off" hx-get="/web/books" hx-trigger="keyup changed delay:300ms" hx-target="#book-list" hx-swap="innerHTML">
    </form>
    <div class="table-wrap"><table><thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Availability</th><th>ISBN</th><th><span class="sr-only">Actions</span></th></tr></thead>
    {{block "content" .}}{{end}}
    </table></div>
  </main>
</body>
</html>
{{end}}
