services:
  api:
    build: .
    image: libratrack:latest
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env}
      DATABASE_URL: postgres://${POSTGRES_USER:-libratrack}:${POSTGRES_PASSWORD:-libratrack}@postgres:5432/${POSTGRES_DB:-libratrack}?sslmode=disable
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libratrack}
      POSTGRES_USER: ${POSTGRES_USER:-libratrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libratrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: